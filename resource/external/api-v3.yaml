  # YouTube creator contact
  /youtube/contact:
    get:
      tags:
        - YouTube
      summary: Get YouTube Contact Information
      description: Retrieve the contact information of the specified YouTube creator.
      operationId: getYoutubeContact
      parameters:
        - name: channelId
          in: query
          description: The unique YouTube channel ID.
          required: true
          schema:
            type: string
            pattern: "^UC[a-zA-Z0-9_-]{22}$"
            minLength: 1
            maxLength: 50
            examples:
              - UCBR8-60-B28hp2BmDPdntcQ
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -X GET "https://apiv3.creatordb.app/youtube/contact?channelId=UCX6OQ3DkcsbYNE6H8uQQuVA" \
              -H "Content-Type: application/json" \
              -H "api-key: <YOUR_API-KEY_HERE>"
      responses:
        "200":
          description: YouTube creator contact information returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Contact information of the specified YouTube creator.
                    properties:
                      emails:
                        type: array
                        description: "Associated email addresses. Empty if unavailable."
                        examples:
                          - - example@email.com
                        items:
                          type: string
                          format: email
                    required:
                      - emails
                    examples:
                      - emails:
                          - example@email.com
                  creditsUsed:
                    type: integer
                    description: Number of API credits consumed by this request.
                    examples:
                      - 1
                  creditsAvailable:
                    type: integer
                    description: "Number of API credits remaining. Returns `-1` if the quota is unlimited."
                    examples:
                      - -1
