                              - max
                          engagement:
                            type: object
                            description: "Engagement performance metrics including rates, per-follower statistics, and consistency analysis."
                            properties:
                              avgEngagementRate:
                                type: number
                                description: |-
                                  Average engagement rate per image post (excluding older pinned image posts), rounded to 4th decimal place. <br />
                                    - *Engagement Rate &#61; (Likes + Comments)/ Followers*
                                minimum: 0
                                examples:
                                  - 0.5201
                              likesPerFollower:
                                type: number
                                description: "Average number of likes per follower, rounded to 4th decimal place."
                                minimum: 0
                                examples:
                                  - 0.1111
                              commentsPerFollower:
                                type: number
                                description: "Average number of comments per follower, rounded to 4th decimal place."
                                minimum: 0
                                examples:
                                  - 0.1111
                              engagementConsistency:
                                type: object
                                description: Consistency of engagement performance.
                                properties:
                                  cv:
                                    type: number
                                    description: |-
                                      *cv &#61; Standard Deviation of Engagement Rate/ Mean Engagement Rate* <br />
                                      - The value is rounded to 4th decimal place. <br />
                                      - Lower values indicate more consistent performance. <br />
                                      - *A value of `0` indicates insufficient data.*
                                    minimum: 0
                                    examples:
                                      - 0.5201
                                  medianVsMean:
                                    type: number
                                    description: |-
                                      *medianVsMean &#61; Median Engagement Rate/ Mean Engagement Rate* <br />
                                      - The value is rounded to 4th decimal place <br />
                                      - Values closer to `1` indicate more consistent performance. <br />
                                      - *A value of `0` indicates insufficient data*.
                                    minimum: 0
                                    examples:
                                      - 0.9001
                                  topBottomRatio:
                                    type: number
                                    description: |-
                                      *topBottomRatio &#61; avg(Top 3 Engagement)/avg(Bottom 3 Engagement)* <br />
