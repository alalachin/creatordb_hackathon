  #YouTube custom filter search
  /youtube/search:
    post:
      tags:
        - YouTube
      summary: Search YouTube Based on Custom Filter Criteria
      description: "Search for YouTube creators using advanced filters such as `displayName`, subscriber count, video performance, and more. Supports fuzzy search, pagination, and multiple filter combinations with up to 10 filters per request. The `creatorList` is, by default, sorted by `displayName`. Custom sorting can be applied using the `sortBy` parameter."
      operationId: searchYoutube
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: "YouTube search request parameters."
              properties:
                filters:
                  type: array
                  description: "Filter objects that include `filterName`, `op`, and `value`. For all accepted `filterName` values and their data types, see [Configuring Custom Search Filters and Examples](http://docs.creatordb.app/api-v3/configuring_advanced_search_filters#available-filtername-&-sortby). You can combine up to 10 filters per request to narrow search results."
                  maxItems: 10
                  items:
                    type: object
                    properties:
                      filterName:
                        type: string
                        description: "The field to apply the filter on."
                      op:
                        type: string
                        enum:
                          - in
                          - ">"
                          - "="
                          - "<"
                        description: "The comparison operator. Accepted values include: `in`, `>`, `=`, `<`. <br /> - String fields accept: `=`, `in`. <br /> - Number fields accept: `>`, `=`, `<`. <br /> - Boolean fields accept: `=` "
                      value:
                        description: "Type depends on the `filterName`. <br /> - String fields accept `string` or `string[]`. <br /> - Number fields accept `number`. <br /> - Boolean fields accept `boolean`. <br /> - Operator `in` accepts `string[]`, operator `=` accepts string for `string` fields."
                        anyOf:
                          - type: string
                          - type: number
                          - type: array
                            maxItems: 100
                            items:
                              type: string
                          - type: boolean
                      isFuzzySearch:
                        type: boolean
                        description: "When `true`, performs a fuzzy match for `string` type `filterName`."
                        default: false
                    required:
                      - filterName
                      - op
                      - value
                desc:
                  type: boolean
