              -H "api-key: <YOUR_API-KEY_HERE>"
      responses:
        "200":
          description: TikTok audience demographic data returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: "Returned audience demographic data of the specified TikTok account."
                    properties:
                      audienceLocations:
                        type: array
                        description: "Country location of the audience, sorted by descending share."
                        examples:
                          - - country: TWN
                              share: 0.6521
                            - country: USA
                              share: 0.0813
                            - country: HKG
                              share: 0.0501
                        items:
                          type: object
                          description: Country distribution of the audience.
