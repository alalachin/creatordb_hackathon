  # YouTube topics
  /youtube/topics:
    get:
      tags:
        - YouTube
      summary: Get All YouTube Topics
      description: Retrieve all available YouTube topics with their categories and creator count. Topics are used for categorizing YouTube creators based on their content themes.
      operationId: getYoutubeTopics
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -X GET "https://apiv3.creatordb.app/youtube/topics" \
              -H "api-key: <YOUR_API-KEY_HERE>"
      responses:
        "200":
          description: YouTube topics. data returned successfully.
          content:
            application/json:
              schema:
                type: object
                description: YouTube Topics API response with all available topics.
                properties:
                  data:
                    type: array
                    description: YouTube topics.
                    items:
                      type: object
                      description: YouTube topic item with metadata.
                      properties:
                        id:
                          type: string
                          description: The unique identifier of the topic.
                          examples:
