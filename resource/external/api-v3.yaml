  # Instagram performance history
  /instagram/performance-history:
    get:
      tags:
        - Instagram
      summary: Get Instagram Performance History Information
      description: "Retrieve daily performance snapshots for a specified Instagram creator within a specific period, including upload activity, follower growth, engagement metrics, and post or reel performance. Dates are returned as Unix timestamps in milliseconds."
      operationId: getInstagramPerformanceHistory
      parameters:
        - name: uniqueId
          in: query
          description: "Instagram account ID. Accepts `instagram` or `@instagram` format (@ is stripped automatically)."
          required: true
          schema:
            type: string
            pattern: "^@?[a-zA-Z0-9._]+$"
            minLength: 1
            maxLength: 31
            examples:
              - instagram
          examples:
            default:
              value: instagram
        - name: pastDayRange
          in: query
          description: "Number of days of historical data to return. For example, `30` returns daily data from the past 30 days. Maximum: `365`."
          required: true
          schema:
            type: string
            pattern: '^[1-9]\d*$'
            examples:
              - "30"
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -X GET "https://apiv3.creatordb.app/instagram/performance-history?uniqueId=cristiano&pastDayRange=30" \
              -H "Content-Type: application/json" \
              -H "api-key: <YOUR_API-KEY_HERE>"
