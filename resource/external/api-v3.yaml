                            minimum: 0
                            examples:
                              - 2
                          90d:
                            type: integer
                            description: Number of videos published in the past 90 days.
                            minimum: 0
                            examples:
                              - 2
                        required:
                          - 7d
                          - 30d
                          - 90d
