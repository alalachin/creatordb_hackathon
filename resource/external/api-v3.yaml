  # Instagram audience demographics
  /instagram/audience:
    get:
      tags:
        - Instagram
      summary: Get Instagram Audience Demographics
      description: "Retrieve audience demographic insights for a specified Instagram creator, including country distribution, gender breakdown, and age composition. This endpoint provides detailed audience analytics to help understand creator reach, evaluate audience alignment, and support data‑driven influencer selection and campaign targeting."
      operationId: getInstagramAudience
      parameters:
        - name: uniqueId
          in: query
          description: "Instagram account ID. Accepts `instagram` or `@instagram` format (@ is stripped automatically)."
          required: true
          schema:
            type: string
            pattern: "^@?[a-zA-Z0-9._]+$"
            minLength: 1
            maxLength: 31
            examples:
              - instagram
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -X GET "https://apiv3.creatordb.app/instagram/audience?uniqueId=cristiano" \
              -H "Content-Type: application/json" \
              -H "api-key: <YOUR_API-KEY_HERE>"
      responses:
        "200":
          description: Instagram audience demographic data returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: "Returned audience demographic data of the specified Instagram account."
                    properties:
                      audienceLocations:
                        type: array
                        description: "Country locations of the audience, sorted by descending share."
                        examples:
                          - - country: TWN
                              share: 0.6521
                            - country: USA
                              share: 0.0813
                            - country: HKG
                              share: 0.0501
                        items:
                          type: object
