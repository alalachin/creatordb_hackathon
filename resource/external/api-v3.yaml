  # Instagram sponsorship info
  /instagram/sponsorship:
    get:
      tags:
        - Instagram
      summary: Get Instagram Sponsorship Information
      description: "Retrieve sponsorship data for a specified Instagram creator, including current and past brand partnerships with performance metrics."
      operationId: getInstagramSponsorship
      parameters:
        - name: uniqueId
          in: query
          description: "Instagram account ID. Accepts `instagram` or `@instagram` format (@ is stripped automatically)."
          required: true
          schema:
            type: string
            pattern: "^@?[a-zA-Z0-9._]+$"
            minLength: 1
            maxLength: 31
            examples:
              - instagram
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -X GET "https://apiv3.creatordb.app/instagram/sponsorship?uniqueId=davidbeckham" \
              -H "Content-Type: application/json" \
              -H "api-key: <YOUR_API-KEY_HERE>"
      responses:
        "200":
          description: Instagram sponsorship data returned successfully.
          content:
            application/json:
              schema:
                type: object
