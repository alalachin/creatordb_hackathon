      security:
        - ApiKeyAuth: []
      servers:
        - url: "https://apiv3.creatordb.app"
          description: Production Environment (CreatorDB Headless API V3)
  # TikTok performance history
  /tiktok/performance-history:
    get:
      tags:
        - TikTok
      summary: Get TikTok Performance History Information
      description: "Retrieve daily performance snapshots for a specified TikTok creator within a specific period, including upload activity, follower growth, engagement metrics, and video performance. Dates are returned as Unix timestamps in milliseconds."
      operationId: getTiktokPerformanceHistory
      parameters:
        - name: uniqueId
          in: query
          description: "TikTok account ID. Accepts `tiktok` or `@tiktok` (@ is stripped automatically)."
          required: true
          schema:
            type: string
            pattern: "^@?[a-zA-Z0-9._-]+$"
            minLength: 1
            maxLength: 101
            examples:
              - tiktok
        - name: pastDayRange
          in: query
          description: "Number of days of historical data to return. For example, `30` returns daily data from the past 30 days. Maximum: `365`."
          required: true
          schema:
            type: string
            pattern: '^[1-9]\d*$'
            examples:
              - "30"
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -X GET "https://apiv3.creatordb.app/tiktok/performance-history?uniqueId=charlidamelio&pastDayRange=30" \
              -H "Content-Type: application/json" \
              -H "api-key: <YOUR_API-KEY_HERE>"
      responses:
        "200":
          description: TikTok performance historical data returned successfully. 
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: The historical performance metrics of the specified TikTok account.
                    properties:
                      histories:
                        type: array
                        description: "Historical performance snapshots, each containing metrics, and a corresponding Unix timestamp in milliseconds."
                        items:
                          type: object
                          description: "A snapshot of the performance metrics on the specified date."
                          properties:
                            timestamp:
                              type: integer
                              description: "The performance snapshot date, represented as a Unix timestamp in milliseconds."
                              exclusiveMinimum: 0
                              examples:
                                - 1755273600000
                            totalFollowers:
                              type: integer
                              description: Total number of followers.
                              minimum: 0
                              examples:
                                - 38100
                            totalFollowing:
                              type: integer
                              description: Total number of accounts followed.
                              minimum: 0
                              examples:
                                - 4757
                            totalContents:
                              type: integer
                              description: Total number of videos.
                              minimum: 0
                              examples:
                                - 305
                            videosPerformanceRecent:
                              type: object
                              description: "Performance metrics of the most recent TikTok videos."
                              properties:
                                likes:
                                  type: object
                                  properties:
                                    all:
                                      type: integer
                                      description: Total number of likes.
                                      minimum: 0
                                      examples:
                                        - 2944445
                                    avg:
                                      type: integer
                                      description: "Average likes per video, rounded to an integer."
                                      minimum: 0
                                      examples:
                                        - 100
                                    median:
                                      type: integer
                                      description: Median number of likes.
                                      minimum: 0
                                      examples:
                                        - 48
                                    min:
                                      type: integer
                                      description: Minimum number of likes.
                                      minimum: 0
                                      examples:
                                        - 20
                                    max:
                                      type: integer
                                      description: Maximum number of likes.
                                      minimum: 0
                                      examples:
                                        - 149
                                  required:
                                    - all
                                    - avg
                                    - median
                                    - min
                                    - max
                                comments:
                                  type: object
                                  properties:
                                    all:
                                      type: integer
                                      description: Total number of comments.
                                      minimum: 0
                                      examples:
                                        - 222344
                                    avg:
                                      type: integer
                                      description: "Average comments per video, rounded to an integer."
                                      minimum: 0
                                      examples:
                                        - 100
                                    median:
                                      type: integer
                                      description: Median number of comments.
                                      minimum: 0
                                      examples:
                                        - 48
                                    min:
                                      type: integer
                                      description: Minimum number of comments.
                                      minimum: 0
                                      examples:
                                        - 20
                                    max:
                                      type: integer
                                      description: Maximum number of comments.
                                      minimum: 0
                                      examples:
                                        - 149
                                  required:
                                    - all
                                    - avg
                                    - median
                                    - min
                                    - max
                                views:
                                  type: object
                                  properties:
                                    all:
                                      type: integer
                                      description: Total number of views.
                                      minimum: 0
                                      examples:
                                        - 3599
                                    avg:
                                      type: integer
                                      description: "Average views per video, rounded to an integer."
                                      minimum: 0
                                      examples:
                                        - 100
                                    median:
                                      type: integer
                                      description: Median number of views.
                                      minimum: 0
                                      examples:
                                        - 48
                                    min:
                                      type: integer
                                      description: Minimum number of views.
                                      minimum: 0
                                      examples:
                                        - 20
                                    max:
                                      type: integer
                                      description: Maximum number of views.
                                      minimum: 0
                                      examples:
                                        - 149
                                  required:
                                    - all
                                    - avg
                                    - median
                                    - min
                                    - max
                                shares:
                                  type: object
                                  properties:
                                    all:
                                      type: integer
                                      description: Total number of shares.
                                      minimum: 0
                                      examples:
                                        - 3599
                                    avg:
                                      type: integer
                                      description: "Average shares per video, rounded to an integer."
                                      minimum: 0
                                      examples:
                                        - 100
                                    median:
                                      type: integer
                                      description: Median number of shares.
                                      minimum: 0
                                      examples:
                                        - 48
                                    min:
                                      type: integer
                                      description: Minimum number of shares.
                                      minimum: 0
                                      examples:
                                        - 20
                                    max:
                                      type: integer
                                      description: Maximum number of shares.
                                      minimum: 0
                                      examples:
                                        - 149
                                  required:
                                    - all
                                    - avg
                                    - median
                                    - min
                                    - max
                                engagement:
                                  type: object
                                  description: "Engagement performance metrics including rates, per-follower statistics, and consistency analysis."
                                  properties:
                                    avgEngagementRate:
                                      type: number
                                      description: |-
                                        Average engagement rate per video, rounded to 4th decimal place. <br />
                                          - *Engagement Rate &#61; (Likes + Comments + Shares)/ Followers*
                                      minimum: 0
                                      examples:
                                        - 0.5201
                                    likesPerFollower:
                                      type: number
                                      description: "Average likes per follower, rounded to 4th decimal place."
                                      minimum: 0
                                      examples:
                                        - 0.1111
                                    commentsPerFollower:
                                      type: number
                                      description: "Average comments per follower, rounded to 4th decimal place."
                                      minimum: 0
                                      examples:
                                        - 0.1111
                                    viewsPerFollower:
                                      type: number
                                      description: "Average views per follower, rounded to 4th decimal place."
                                      minimum: 0
                                      examples:
                                        - 0.1111
                                    engagementConsistency:
                                      type: object
                                      description: Consistency of engagement performance.
                                      properties:
                                        cv:
                                          type: number
                                          description: |-
                                            *cv &#61; Standard Deviation of Engagement Rate/ Mean Engagement Rate* <br />
                                            - The value is rounded to 4th decimal place. <br />
                                            - Lower values indicate more consistent performance. <br />
                                            - *A value of `0` indicates insufficient data.*
                                          minimum: 0
                                          examples:
                                            - 0.1201
                                        medianVsMean:
                                          type: number
                                          description: |-
                                            *medianVsMean &#61; Median Engagement Rate/ Mean Engagement Rate* <br />
                                            - The value is rounded to 4th decimal place. <br />
                                            - Values closer to `1` indicate more consistent performance. <br />
                                            - *A value of `0` indicates insufficient data.*
                                          minimum: 0
                                          examples:
                                            - 0.9001
                                        topBottomRatio:
                                          type: number
                                          description: |-
                                            *topBottomRatio &#61; avg(Top 3 Engagement)/avg(Bottom 3 Engagement)* <br />
                                            - The value is rounded to 4th decimal place. <br />
                                            - Lower ratios indicate more consistent performance. <br />
                                            - *A value of `0` indicates insufficient data.*
                                          minimum: 0
                                          examples:
                                            - 1.2001
                                        consistencyScore:
                                          type:
                                            - integer
                                            - "null"
                                          description: |-
                                            *consistencyScore &#61; 100 - [(cvScore*weight_cv) + (topBottomScore*weight_topBottom) + (medianVsMeanScore*weight_medianVsMean)]* <br />
                                            - The score is rounded to an integer. <br />
                                            - A higher score indicates more stable and consistent performance. <br />
                                            - If any of the three indicators is `0`, the `consistencyScore` will be `null`.
                                          minimum: 0
                                          maximum: 100
                                          examples:
                                            - 63
                                        consistencyLevel:
                                          type: string
                                          enum:
                                            - high
                                            - moderate
                                            - low
                                            - null
                                          description: |-
                                            A qualitative label based on the `consistencyScore`: <br />
                                            - high: 81 - 100 <br />
                                            - moderate: 51 - 80 <br />
                                            - low: 0 - 50 <br />
                                            - Returns `null` when `consistencyScore` is `null`.
                                          examples:
                                            - moderate
                                      required:
                                        - cv
                                        - medianVsMean
                                        - topBottomRatio
                                        - consistencyScore
                                        - consistencyLevel
                                  required:
                                    - avgEngagementRate
                                    - likesPerFollower
                                    - commentsPerFollower
                                    - viewsPerFollower
                                    - engagementConsistency
                              required:
                                - likes
                                - comments
