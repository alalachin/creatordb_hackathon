  # YouTube creator profile
  /youtube/profile:
    get:
      tags:
        - YouTube
      summary: Get YouTube Profile Information
      description: "Retrieve the profile information of a specified YouTube creator, including metadata such as subscriber count, account type, language, hashtags, and more."
      operationId: getYoutubeProfile
      parameters:
        - name: channelId
          in: query
          description: The unique YouTube channel ID.
          required: true
          schema:
            type: string
            pattern: "^UC[a-zA-Z0-9_-]{22}$"
            minLength: 1
            maxLength: 50
            examples:
              - "UCX6OQ3DkcsbYNE6H8uQQuVA"
      x-codeSamples:
