  # TikTok custom filter search
  /tiktok/search:
    post:
      tags:
        - TikTok
      summary: Search TikTok Based on Custom Filter Criteria
      description: "Search for TikTok creators using advanced filters such as `displayName`, follower count, content performance, and more. The `creatorList` is, by default, sorted by `displayName`. Custom sorting can be applied using the `sortBy` parameter."
      operationId: searchTiktok
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: "TikTok search request parameters."
              properties:
                filters:
                  type: array
                  description: "Filter objects that include `filterName`, `op`, and `value`. For all accepted `filterName` values and their data types, see [Configuring Custom Search Filters and Examples](http://docs.creatordb.app/api-v3/configuring_advanced_search_filters#available-filtername-&-sortby). You can combine up to 10 filters per request to narrow search results."
                  maxItems: 10
                  items:
                    type: object
                    properties:
                      filterName:
                        type: string
                        description: The field to apply the filter on.
                      op:
                        type: string
                        enum:
                          - in
                          - ">"
                          - "="
                          - "<"
                        description: "The comparison operator. Accepted values include `in`, `>`, `=`, `<`. <br /> -String fields accept: `=`, `in`. <br /> -Number fields accept: `>`, `=`, `<`. <br /> -Boolean fields accept: `=`"
                      value:
                        description: "Type depends on the `filterName`. <br /> - String fields accept `string` or `string[]`. <br /> - Number fields accept `number`. <br /> -Boolean fields accept `boolean`. <br /> - Operator `in` accepts `string[]`, operator `=` accepts string for string fields."
                        anyOf:
                          - type: number
                          - type: array
                            maxItems: 100
                            items:
                              type: string
                          - type: boolean
                      isFuzzySearch:
                        type: boolean
                        description: "When `true`, performs a fuzzy match for `string` type `filterName`."
                    required:
                      - filterName
                      - op
                      - value
                desc:
                  type: boolean
                  description: "Sort order for results. `true` for descending, `false` for ascending order."
                sortBy:  
                  type: string
                  description: "The field to sort results by. For example, `totalFollowers` sorts by follower count."
                pageSize:
                  type: integer
                  description: Specifies the maximum number of results to return in a single response. The upper limit is 100.
                  minimum: 1
                  maximum: 100
                offset:
                  type: integer
                  description: Indicates the number of records to skip before returning results. Used for pagination.
                  minimum: 0
              required:
                - filters
                - pageSize
                - offset
              examples:
                - filters:
                    - filterName: displayName
                      op: "="
                      value: beast
                      isFuzzySearch: true
                  desc: true
                  sortBy: displayName
                  pageSize: 10
                  offset: 0
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -X POST "https://apiv3.creatordb.app/tiktok/search" \
              -H "Content-Type: application/json" \
              -H "api-key: <YOUR_API-KEY_HERE>" \
              -d '{
                "filters": [
                  {"filterName": "avgVideosEngagementRate", "op": ">", "value": 0.03},
                  {"filterName": "totalContents", "op": ">", "value": 20},
                  {"filterName": "followerGrowthIn30d", "op": ">", "value": 1000},
                  {"filterName": "avgVideosLikes", "op": ">", "value": 500}
                ],
