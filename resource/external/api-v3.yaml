                              examples:
                                - TWN
                            share:
                              type: number
                              description: "Proportion of audience from that country, rounded to 4th decimal place."
                              examples:
                                - 0.6521
                          required:
                            - country
                            - share
                      audienceGender:
                        type: object
                        description: Gender distribution of the audience.
                        properties:
                          maleRatio:
                            type: number
                            description: "Proportion of male audience, rounded to 4th decimal place."
                            examples:
                              - 0.3233
                          femaleRatio:
                            type: number
                            description: "Proportion of female audience, rounded to 4th decimal place."
                            examples:
                              - 0.6412
                        required:
                          - maleRatio
                          - femaleRatio
                        examples:
                          - maleRatio: 0.3233
                            femaleRatio: 0.6412
                      audienceAvgAge:
                        type: integer
                        description: "Average age of the audience, rounded to an integer."
                        examples:
