                          properties:
                            country:
                              type: string
                              description: The country in **ISO 3166-1 alpha-3** format. For details, see [Country Codes](http://docs.creatordb.app/api-v2/country-code).
                              examples:
                                - TWN
                            share:
                              type: number
                              description: "Proportion of audience from that country, rounded to 4th decimal place."
                              examples:
                                - 0.6521
                          required:
                            - country
                            - share
                      audienceGender:
                        type: object
                        description: Gender distribution of the audience.
                        properties:
                          maleRatio:
                            type: number
                            description: "Proportion of male audience, rounded to 4th decimal place."
                            examples:
