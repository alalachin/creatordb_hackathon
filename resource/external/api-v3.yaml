  /youtube/subtitles/download:
    get:
      summary: Download YouTube Subtitles as a JSON File
      description: "Streams the specified YouTube video's subtitle data as a JSON file download with the filename format `{videoId}-{vssId}.json`. Returns a `content-disposition` attachment. Returns `404` if the video or subtitle ID is not found."
      operationId: getYoutubeSubtitleDownload
      tags:
        - YouTube
      parameters:
        - name: videoId
          in: query
          description: "The unique YouTube video ID (length: 11 characters)."
          required: true
          schema:
            type: string
            minLength: 11
            maxLength: 11
            pattern: '^[a-zA-Z0-9_-]{11}$'
            examples:
              - icxrUIGoEg8
        - name: vssId
          in: query
          description: 'The subtitle language record code (example: `a.en`, `.en`, `.zh-Hant`).'
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 20
            examples:
              - .en
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -X GET "https://apiv3.creatordb.app/youtube/subtitles/download?videoId=icxrUIGoEg8&vssId=.en" \
              -H "api-key: <YOUR_API-KEY_HERE>"
      responses:
        "200":
          description: Subtitle data of the specified YouTube video downloaded successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  _streaming:
                    type: boolean
                    enum:
                      - true
                description: 'Streams subtitle data as a JSON file download (chunked transfer encoding). Content-Type: application/json, Content-Disposition: attachment; filename="{videoId}-{vssId}.json"'
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                type: object
                title: ValidationErrorResponse
                description: Parameter validation error response format.
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  error:
                    type: string
                  message:
                    type: string
                  timestamp:
                    type: integer
                required:
                  - success
                  - error
                  - message
                  - timestamp
              examples:
                missing videoId:
                  summary: Missing videoId
                  value:
                    success: false
                    error: "VALIDATION_ERROR"
                    message: "Missing required field: 'videoId'."
                    timestamp: 1770099403116
                missing vssId:
                  summary: Missing vssId
                  value:
                    success: false
                    error: "VALIDATION_ERROR"
                    message: "Missing required field: 'vssId'."
                    timestamp: 1770099403116
        "429":
          description: Exceeded quota or rate limit.
          content:
            application/json:
              schema:
                type: object
                title: QuotaErrorResponse
                description: Quota error response format.
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  error:
                    type: string
                  message:
                    type: string
                  remainingPlanCredit:
                    type: number
                required:
                  - success
                  - error
                  - message
                  - remainingPlanCredit
              examples:
                rate limit:
                  summary: Rate limit exceeded
                  value:
                    success: false
                    error: "RATE_LIMIT_EXCEEDED"
                    message: "Too many requests. Please try again later."
                quota exceeded:
                  summary: Credit quota exceeded
                  value:
                    success: false
                    error: "QUOTA_EXCEEDED"
                    message: "Not enough credits to complete this request."
  #Instagram
  # Instagram custom filter search
  /instagram/search:
    post:
      tags:
        - Instagram
      summary: Search Instagram Based on Custom Filter Criteria
      description: "Search for Instagram creators using advanced filters such as `displayName`, follower count, content performance, and more. Supports fuzzy search, pagination, and multiple filter combinations with up to 10 filters per request. The `creatorList` is, by default, sorted by `displayName`. Custom sorting can be applied using the `sortBy` parameter."
      operationId: searchInstagram
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: "Instagram search request parameters."
              properties:
                filters:
                  type: array
                  description:
                    "Filter objects that include `filterName`, `op`, and `value`. For the full list of accepted `filterName` values and data types, see [Configuring Custom Search Filters and Examples](https://docs.creatordb.app/api-v3/configuring_advanced_search_filters#available-filtername-&-sortby-2). You can combine up to 10 filters per request to narrow search results.
                    op:
                    type: string
                    enum:"
                  maxItems: 10
                  items:
                    type: object
                    properties:
                      filterName:
                        type: string
                        description: The field to apply the filter on.
                      op:
                        type: string
                        enum:
                          - in
                          - ">"
                          - "="
                          - "<"
                        description: "The comparison operator. Accepted values include `in`, `>`, `=`, `<`. <br /> -String fields accept: `=`, `in`. <br /> -Number fields accept: `>`, `=`, `<`. <br /> -Boolean fields accept: `=`"
                      value:
                        description: 'Type depends on the `filterName`. <br /> - String fields accept `string` or `string[]`. <br /> - Number fields accept `number`. <br /> -Boolean fields accept `boolean`. <br /> -Operator "in" accepts `string[]`, operator "=" accepts string for string fields.'
                        anyOf:
                          - type: string
                          - type: number
                          - type: array
                            maxItems: 100
                            items:
                              type: string
                          - type: boolean
                      isFuzzySearch:
                        type: boolean
                        description: "When `true`, performs a fuzzy match for `string` type `filterName`."
                        default: false
                    required:
                      - filterName
                      - op
                      - value
                desc:
                  type: boolean
                  description: "Sort order for results. `true` for descending, `false` for ascending order."
                sortBy:
                  type: string
                  description: "The field to sort results by. For example, `totalFollowers` sorts by follower count."
                pageSize:
                  type: integer
                  description: Specifies the maximum number of results to return in a single response. The upper limit is 100.
                  minimum: 1
                  maximum: 100
                offset:
                  type: integer
                  description: Indicates the number of records to skip before returning results. Used for pagination.
                  minimum: 0
              required:
                - filters
                - pageSize
                - offset
              examples:
                - filters:
                    - filterName: displayName
                      op: "="
                      value: beast
                      isFuzzySearch: true
                  desc: true
                  sortBy: displayName
                  pageSize: 10
                  offset: 0
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -X POST "https://apiv3.creatordb.app/instagram/search" \
              -H "Content-Type: application/json" \
              -H "api-key: <YOUR_API-KEY_HERE>" \
              -d '{
                "filters": [
                  {"filterName": "country", "op": "=", "value": "USA"},
                  {"filterName": "mainLanguage", "op": "=", "value": "eng"},
                  {"filterName": "hasSponsors", "op": "=", "value": true},
                  {"filterName": "totalFollowers", "op": ">", "value": 50000},
                  {"filterName": "totalFollowers", "op": "<", "value": 500000},
                  {"filterName": "avgReelsViews", "op": ">", "value": 20000},
                  {"filterName": "avgImagesLikes", "op": ">", "value": 1000},
                  {"filterName": "totalContents", "op": ">", "value": 50}
                ],
                "sortBy": "avgReelsEngagementRate",
                "desc": true,
                "pageSize": 50,
                "offset": 0
              }'
      responses:
        "200":
          description: Instagram search results returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Search results containing Instagram creators and pagination information.
                    properties:
                      creatorList:
                        type: array
                        description: Creator objects matching the search query.
                        items:
                          type: object
                          description: Creator details in search results.
                          properties:
                            displayName:
                              type: string
                              description: The Instagram account name.
                              examples:
                                - Instagram
                            uniqueId:
                              type: string
                              description: "The Instagram handle."
                              examples:
                                - instagram
                            avatarUrl:
                              type: string
                              description: The profile picture URL.
                              examples:
                                - "https://instagram.ftpe8-4.fna.fbcdn.net/..."
                            totalFollowers:
                              type: integer
                              description: Total number of followers.
                              minimum: 0
                              examples:
                                - 613344
                          required:
                            - displayName
                            - uniqueId
                            - avatarUrl
                            - totalFollowers
                      hasNextPage:
                        type: boolean
                        description: "`true` if there is a next page of results."
                        examples:
                          - true
                      nextOffset:
                        type: integer
                        description: The offset value for retrieving the next page of results.
                        minimum: 0
                        examples:
                          - 100
                    required:
                      - creatorList
                      - hasNextPage
                      - nextOffset
                  creditsUsed:
                    type: integer
                    description: Number of API credits consumed by this request.
                    examples:
                      - 1
                  creditsAvailable:
                    type: integer
                    description: "Number of API credits remaining. Returns `-1` if the quota is unlimited."
                    examples:
                      - -1
                  traceId:
                    type: string
                    description: Unique trace ID for each request.
                    examples:
                      - f8e4a3b2c1d0e9f8a7b6c5d4e3f2a1b0
                  timestamp:
                    type: integer
                    description: "Time the response was generated, represented as a Unix timestamp in milliseconds."
                    examples:
                      - 1750732453635
                  errorCode:
                    type: string
                    description: Error code returned if the request fails. Empty if the request is successful.
                    examples:
                      - ""
                  errorDescription:
                    type: string
                    description: Description of the error. Empty if the request is successful.
                    examples:
                      - ""
                  success:
                    type: boolean
                    description: "`true` if the request is successful."
                    examples:
                      - true
                required:
                  - data
                  - traceId
                  - timestamp
                  - errorCode
                  - errorDescription
                  - success
                  - creditsUsed
                  - creditsAvailable
              examples:
                default:
