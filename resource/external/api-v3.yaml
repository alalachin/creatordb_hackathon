          description: Production Environment (CreatorDB Headless API V3)
  # YouTube creator performance
  /youtube/performance:
    get:
      tags:
        - YouTube
      summary: Get YouTube Performance Information
      description: "Retrieve advanced performance information of a specified YouTube creator, including upload activity, subscriber growth, engagement metrics, and video performance."
      operationId: getYoutubePerformance
      parameters:
        - name: channelId
          in: query
          description: The unique YouTube channel ID.
          required: true
          schema:
            type: string
            pattern: "^UC[a-zA-Z0-9_-]{22}$"
            minLength: 1
            maxLength: 50
            examples:
              - UCBR8-60-B28hp2BmDPdntcQ
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -X GET "https://apiv3.creatordb.app/youtube/performance?channelId=UCX6OQ3DkcsbYNE6H8uQQuVA" \
              -H "Content-Type: application/json" \
              -H "api-key: <YOUR_API-KEY_HERE>"
      responses:
        "200":
          description: Performance data of the specified YouTube creator returned successfully.
