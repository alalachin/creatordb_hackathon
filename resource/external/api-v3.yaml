        - url: "https://apiv3.creatordb.app"
          description: Production Environment (CreatorDB Headless API V3)
  # Instagram creator profile
  /instagram/profile:
    get:
      tags:
        - Instagram
      summary: Get Instagram Profile Information
      description: "Retrieve basic profile information of a specified Instagram creator, including metadata such as follower count, account type, language, hashtags, and more."
      operationId: getInstagramProfile
      parameters:
        - name: uniqueId
          in: query
          description: "Instagram account ID. Accepts `instagram` or `@instagram` format (@ is stripped automatically)."
          required: true
          schema:
            type: string
            pattern: "^@?[a-zA-Z0-9._]+$"
            minLength: 1
            maxLength: 31
            examples:
              - instagram
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -X GET "https://apiv3.creatordb.app/instagram/profile?uniqueId=cristiano" \
              -H "Content-Type: application/json" \
              -H "api-key: <YOUR_API-KEY_HERE>"
      responses:
        "200":
          description: Instagram creator profile information returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: "Profile information of the specified Instagram creator."
                    properties:
                      uniqueId:
                        type: string
                        description: "The Instagram handle."
                        examples:
                          - instagram
                      displayName:
                        type: string
                        description: The Instagram account name.
                        examples:
                          - Instagram
                      category:
                        type: string
                        description: The professional account category.
                        examples:
                          - Art
                      avatarUrl:
                        type: string
                        description: The profile picture URL.
                        format: uri
                        examples:
                          - "https://instagram.ftpe8-4.fna.fbcdn.net/v/t51.2885-19/500169417_18514151086053040_2166230648120544979_n.jpg"
                      bio:
                        type: string
                        description: The profile biography.
                        examples:
                          - Capture and share the world's moments
                      isBusinessAccount:
                        type: boolean
                        description: "`true` if it is a business account."
                        examples:
                          - false
                      isPrivateAccount:
                        type: boolean
                        description: "`true` if it is a private account."
                        examples:
                          - false
                      isVerified:
                        type: boolean
                        description: "`true` if it is verified by Instagram."
                        examples:
                          - true
                      hasSponsors:
                        type: boolean
                        description: "`true` if there is sponsored content."
                        examples:
                          - true
                      country:
                        type: string
                        description: "The country in **ISO 3166-1 alpha-3** format. For the country code list, see [here](https://docs.creatordb.app/api-v2/country-code)."
                        examples:
                          - TWN
                      mainLanguage:
                        type: string
                        description: "The primary language used in posts, represented in **ISO 639-3** format. For the language code list, see [here](https://docs.creatordb.app/api-v3/language-code)."
                        examples:
                          - zht
                      languages:
                        type: array
                        description: "All languages used in posts, represented in **ISO 639-3** format. For the language code list, see [here](https://docs.creatordb.app/api-v3/language-code)."
                        examples:
                          - - zht
                            - eng
                        items:
                          type: string
                      secondLanguage:
                        type: string
                        description: "The secondary language used in Instagram posts, represented in **ISO 639-3** format. For language code list, see [here](https://docs.creatordb.app/api-v3/language-code)."
                        examples:
                          - eng
                      totalContents:
                        type: integer
                        description: Total number of image posts and reels.
                        minimum: 0
                        examples:
                          - 1609
                      totalFollowers:
                        type: integer
                        description: Total number of followers.
                        minimum: 0
                        examples:
                          - 613344
                      totalFollowing:
                        type: integer
                        description: Total number of accounts followed.
                        minimum: 0
                        examples:
                          - 1204
                      subscriberGrowth:
                        type: object
                        description: "Follower growth metrics over 7, 30, and 90-day periods."
                        properties:
                          g7:
                            type: number
                            description: "Follower growth over 7 days, rounded to 4th decimal place."
                            examples:
                              - 0.1234
                          g30:
                            type: number
                            description: "Follower growth over 30 days, rounded to 4th decimal place."
                            examples:
                              - 0.2345
                          g90:
                            type: number
                            description: "Follower growth over 90 days, rounded to 4th decimal place."
                            examples:
                              - 0.3456
                        required:
                          - g7
                          - g30
                          - g90
                      hashtags:
                        type: array
                        description: Hashtags in Instagram content and usage statistics.
                        items:
                          type: object
