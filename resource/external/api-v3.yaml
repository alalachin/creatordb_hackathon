  # TikTok audience demographics
  /tiktok/audience:
    get:
      tags:
        - TikTok
      summary: Get TikTok Audience Demographics
      description: "Retrieve audience demographic insights for a specified TikTok creator, including country distribution, gender breakdown, and age composition. This endpoint provides detailed audience analytics to help understand creator reach, evaluate audience alignment, and support data‑driven influencer selection and campaign targeting."
      operationId: getTiktokAudience
      parameters:
        - name: uniqueId
          in: query
          description: "TikTok account ID. Accepts `tiktok` or `@tiktok` (@ is stripped automatically)."
          required: true
          schema:
            type: string
            pattern: "^@?[a-zA-Z0-9._-]+$"
            minLength: 1
            maxLength: 101
            examples:
              - tiktok
