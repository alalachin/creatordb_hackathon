openapi: 3.1.0
info:
  version: 1.0.0
  title: CreatorDB Headless API V3
  description: "# CreatorDB Headless API V3"
  contact:
    name: CreatorDB
    url: "https://www.creatordb.app"
    email: support@creatordb.app
  license:
    url: "http://www.apache.org/licenses/LICENSE-2.0.html"
    name: Apache 2.0
servers:
  - url: "https://apiv3.creatordb.app"
    description: Production Environment (CreatorDB Headless API V3)
paths:
  /usage:
    get:
      tags:
        - User Account
      summary: Get API Usage Statistics
      description: Retrieves your API usage statistics within the specified date range (maximum 365 days). Defaults to 7 days ago when no start or end dates are provided.
      operationId: getApiUsage
      parameters:
        - name: start
          in: query
          description: "Start date, represented as a Unix timestamp in milliseconds. Defaults to 7 days ago."
          required: false
          schema:
            type: string
            examples:
              - "1737312000000"
        - name: end
          in: query
          description: "End date, represented as a Unix timestamp in milliseconds. Defaults to current time."
          required: false
          schema:
            type: string
            examples:
              - "1737398400000"
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -X GET "https://apiv3.creatordb.app/usage" \
              -H "api-key: <YOUR_API-KEY_HERE>"
      responses:
        "200":
          description: API credit usage results returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: API usage data containing records and count.
                    properties:
                      records:
                        type: array
                        description: API usage records for the requested date range.
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                              description: Date in YYYYMMDD format (UTC±0).
                              pattern: '^\d{8}$'
                              examples:
                                - "20260120"
                            requestCount:
                              type: integer
                              description: Total number of API requests for this API key on this day.
                              minimum: 0
                              examples:
                                - 47
                            totalQuotaUsed:
                              type: integer
                              description: Total credits consumed for this API key on this day.
                              minimum: 0
                              examples:
                                - 47
                            endpoints:
                              type: object
                              description: Request count and quota usage per endpoint.
                              additionalProperties:
                                type: object
                                properties:
                                  count:
                                    type: integer
                                    description: Number of requests made to this endpoint.
                                    minimum: 0
                                  creditsUsed:
                                    type: integer
                                    description: Total quota consumed by this endpoint.
                                    minimum: 0
                                required:
                                  - count
                                  - creditsUsed
                              examples:
                                - searchInstagram:
                                    count: 12
                                    creditsUsed: 12
                                  getInstagramProfile:
                                    count: 8
                                    creditsUsed: 8
                                  getTiktokProfile:
                                    count: 10
                                    creditsUsed: 10
                            platforms:
                              type: object
                              description: "Number of requests per social media platform. Empty when no platform-specific calls were made."
                              additionalProperties:
                                type: integer
                                minimum: 0
                              default: {}
                              examples:
                                - instagram: 20
                                  tiktok: 10
                                  youtube: 17
                            quotaByPlatform:
                              type: object
                              description: "Quota consumed per social media platform. Empty when no platform-specific calls were made."
                              additionalProperties:
                                type: integer
                                minimum: 0
                              default: {}
                              examples:
                                - instagram: 20
                                  tiktok: 10
                                  youtube: 17
                          required:
                            - date
                            - requestCount
                            - totalQuotaUsed
                            - endpoints
                      count:
                        type: integer
                        description: "Total number of records returned."
                        minimum: 0
                        examples:
                          - 7
                    required:
                      - records
                      - count
                  creditsUsed:
                    type: integer
                    description: Total number of API credits consumed across all requests in this session.
                    examples:
                      - 1
                  creditsAvailable:
                    type: integer
                    description: "Number of API credits remaining. Returns `-1` if the quota is unlimited."
                    examples:
                      - -1
                  traceId:
                    type: string
                    description: "Unique trace ID for each request."
                    examples:
                      - f8e4a3b2c1d0e9f8a7b6c5d4e3f2a1b0
                  timestamp:
                    type: integer
                    description: "Time the response was generated, represented as a Unix timestamp in milliseconds."
                    examples:
                      - 1750732453635
                  errorCode:
                    type: string
                    description: "Error code returned if the request fails. Empty if the request is successful."
                    examples:
                      - ""
                  errorDescription:
                    type: string
                    description: "Description of the error. Empty if the request is successful."
                    examples:
                      - ""
                  success:
                    type: boolean
                    description: "`true` if the request is successful."
                    examples:
                      - true
                required:
                  - data
                  - traceId
                  - timestamp
                  - errorCode
                  - errorDescription
                  - success
                  - creditsUsed
                  - creditsAvailable
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                type: object
                title: ValidationErrorResponse
                properties:
                  success:
                    const: false
                  error:
                    type: string
                  message:
                    type: string
                  timestamp:
                    type: integer
                required:
                  - success
                  - error
                  - message
                  - timestamp
              examples:
                invalid date range:
                  summary: Date range exceeds 365 days
                  value:
                    success: false
                    error: "VALIDATION_ERROR"
                    message: "The 'start' and 'end' date range cannot exceed 365 days."
                    timestamp: 1770099403116
        "429":
          description: Exceeded quota or rate limit.
          content:
            application/json:
              schema:
                type: object
                title: QuotaErrorResponse
                properties:
                  success:
                    const: false
                  error:
                    type: string
                  message:
                    type: string
                  remainingPlanCredit:
                    type: number
                required:
                  - success
                  - error
                  - message
                  - remainingPlanCredit
              examples:
                rate limited:
                  summary: Rate limit exceeded
                  value:
                    success: false
                    error: "RATE_LIMIT_EXCEEDED"
                    message: "Too many requests. Please try again later."
                quota exceeded:
                  summary: Credit quota exceeded
                  value:
                    success: false
                    error: "QUOTA_EXCEEDED"
                    message: "Not enough credits to complete this request."
      security:
        - ApiKeyAuth: []
      servers:
        - url: "https://apiv3.creatordb.app"
          description: Production Environment (CreatorDB Headless API V3)
  #YouTube
  # Natural language search (unified, cross-platform)
  /nls:
    post:
      tags:
        - Natural Language Search
      summary: Search Creators Using Natural Language
      description: >-
        Search for creators across YouTube, Instagram, and TikTok using natural language descriptions.
        The AI determines the appropriate platform from your query and converts it into structured search filters.
        Results are delivered via Server-Sent Events (SSE) streaming.
      operationId: getNLS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Natural language search parameters.
              properties:
                description:
                  type: string
                  description: A natural language description of the creators you are looking for.
                  minLength: 1
                  maxLength: 1000
                  example: "Find US-based YouTube beauty creators that own makeup brands and have more than 15 million subscribers"
              required:
                - description
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -X POST "https://apiv3.creatordb.app/nls" \
              -H "Content-Type: application/json" \
              -H "api-key: <YOUR_API_KEY>" \
              -d '{
                "description": "Find US-based YouTube beauty creators that own makeup brands and have more than 15 million subscribers"
              }'
        - lang: python
          label: Python
          source: |
            import requests

            url = "https://apiv3.creatordb.app/nls"

            payload = { "description": "Find US-based YouTube beauty creators that own makeup brands and have more than 15 million subscribers" }
            headers = {
                "api-key": "<api-key>",
                "Content-Type": "application/json"
            }

            response = requests.post(url, json=payload, headers=headers, stream=True)

            for line in response.iter_lines(decode_unicode=True):
                print(line)
      responses:
        "200":
          description: >-
            NLS results are delivered via Server-Sent Events (SSE). The stream emits multiple `event: progress` messages with status updates (e.g., `{"message":"Loading..."}`, `{"message":"Analyzing intent..."}`, `{"message":"Query ready..."}`), followed by a final `event: result` containing the response object shown below. Connect using an SSE-capable client or `stream=True` in your HTTP library.
          content:
            text/event-stream:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      creatorList:
                        type: array
                        description: Matching creators. Present when the query returns results.
                        items:
                          type: object
                          properties:
                            displayName:
                              type: string
                              description: The creator display name.
                            uniqueId:
                              type: string
                              description: The creator handle.
                            channelId:
                              type: string
                              description: YouTube channel ID (YouTube results only).
                            avatarUrl:
                              type: string
                              description: Profile picture URL.
                            totalSubscribers:
                              type: integer
                              description: Subscriber count (YouTube results).
                            totalFollowers:
                              type: integer
                              description: Follower count (Instagram and TikTok results).
                      platform:
                        type: string
                        description: The platform detected from the query.
                        enum:
                          - youtube
                          - instagram
                          - tiktok
                      message:
                        type: string
                        description: Explanation when the query is too broad (suggestion response).
                      suggestion:
                        type: array
                        items:
                          type: string
                        description: Refined query suggestions when the original query is too broad.
                  creditsUsed:
                    type: number
                    description: Credits consumed for this request (dynamic, based on token usage).
                    examples:
                      - 3.04
                  creditsAvailable:
                    type: number
                    description: Remaining available credits.
                    examples:
                      - 2627.89
                  traceId:
                    type: string
                    description: Unique identifier for the request.
                    examples:
                      - "6ddf6c22a7a84b83e9a98f70a06e6235"
                  timestamp:
                    type: integer
                    description: Time the response was generated (Unix timestamp in milliseconds).
                    examples:
                      - 1774586488186
                  errorCode:
                    type: string
                    description: Error code if the request fails. Empty on success.
                    examples:
                      - ""
                  errorDescription:
                    type: string
                    description: Error description if the request fails. Empty on success.
                    examples:
                      - ""
                  success:
                    type: boolean
                    description: Whether the request completed successfully.
                    examples:
                      - true
                required:
                  - data
                  - traceId
                  - timestamp
                  - errorCode
                  - errorDescription
                  - success
                  - creditsUsed
                  - creditsAvailable
              examples:
                default:
                  summary: SSE stream with progress events and final result
                  value:
                    - event: progress
                      data:
                        message: "Loading..."
                    - event: progress
                      data:
                        message: "Query validated..."
                    - event: progress
                      data:
                        message: "Analyzing intent..."
                    - event: progress
                      data:
                        message: "Processing request..."
                    - event: progress
                      data:
                        message: "Identifying filters..."
                    - event: progress
                      data:
                        message: "Working on it..."
                    - event: progress
                      data:
                        message: "Getting the right filters..."
                    - event: progress
                      data:
                        message: "Analysis complete..."
                    - event: progress
                      data:
                        message: "Putting it all together..."
                    - event: progress
                      data:
                        message: "Building query..."
                    - event: progress
                      data:
                        message: "Query ready..."
                    - event: result
