          description: Production Environment (CreatorDB Headless API V3)
  #YouTube creator performance history
  /youtube/performance-history:
    get:
      tags:
        - YouTube
      summary: Get YouTube Creator Performance History Information
      description: "Retrieve daily performance snapshots for a specified YouTube creator, including upload activity, subscriber growth, engagement metrics, and video performance. Dates are returned as Unix timestamps in milliseconds."
      operationId: getYoutubePerformanceHistory
      parameters:
        - name: channelId
          in: query
          description: The unique YouTube channel ID.
          required: true
          schema:
            type: string
            pattern: "^UC[a-zA-Z0-9_-]{22}$"
            minLength: 1
            maxLength: 50
            examples:
              - UCBR8-60-B28hp2BmDPdntcQ
        - name: pastDayRange
          in: query
          description: "Number of days of historical data to return. For example, `30` returns daily data from the past 30 days. Maximum: `365`."
          required: true
          schema:
            type: string
            pattern: '^[1-9]\d*$'
            examples:
              - "30"
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -X GET "https://apiv3.creatordb.app/youtube/performance-history?channelId=UCX6OQ3DkcsbYNE6H8uQQuVA&pastDayRange=7" \
              -H "Content-Type: application/json" \
              -H "api-key: <YOUR_API-KEY_HERE>"
      responses:
        "200":
          description: YouTube creator performance historical data returned successfully.
